<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ACC Consultation System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f7fb;
        }

        .login-card {

            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .alert {

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 18px;
        }

        .danger {

            background: #fee2e2;

            color: #991b1b;
        }

        .success {

            background: #dcfce7;

            color: #166534;
        }

        .register {

            text-align: center;

            margin-top: 20px;
        }

        .register a {

            color: #2563eb;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>ACC Consultation System</h1>

    <p class="subtitle">
        Secure Consultation Portal
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form
        method="POST"
        action="{{ url_for('auth.login') }}"
    >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">

        Don't have an account?

        <a href="{{ url_for('auth.register') }}">
            Create Student Account
        </a>

    </div>

</div>

</body>

</html>
