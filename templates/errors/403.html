<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>403 - Access Denied</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 500px;

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 64px;
            margin: 0;

            color: #dc2626;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 22px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>403</h1>

    <h2>Access Denied</h2>

    <p>
        You do not have permission to access this page.
    </p>

    <a href="{{ url_for('auth.login') }}">
        Back to Login
    </a>

</div>

</body>

</html>
