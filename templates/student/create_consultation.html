<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Consultation</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #6b7280;
        }

        label {
            display: block;

            font-weight: bold;

            margin-top: 20px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            box-sizing: border-box;
        }

        textarea {
            min-height: 140px;

            resize: vertical;
        }

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        button,
        .back {
            padding: 12px 20px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 15px;

            cursor: pointer;
        }

        button {
            border: none;

            background: #2563eb;

            color: white;
        }

        .back {
            background: #e5e7eb;

            color: #1f2937;
        }

        .alert {
            padding: 12px;

            margin-bottom: 15px;

            border-radius: 7px;

            background: #fee2e2;

            color: #991b1b;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            New Consultation
        </h1>

        <p class="subtitle">
            Submit your concern to a medical expert.
        </p>


        {% with messages =
            get_flashed_messages(with_categories=true)
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>
                Consultation Type *
            </label>

            <select
                name="consultation_type"
                required
            >

                <option value="">
                    Select consultation type
                </option>

                <option value="General Consultation">
                    General Consultation
                </option>

                <option value="Mental Health">
                    Mental Health
                </option>

                <option value="Nutrition">
                    Nutrition
                </option>

                <option value="First Aid">
                    First Aid
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Subject *
            </label>

            <input
                type="text"
                name="subject"
                placeholder="Enter consultation subject"
                required
            >


            <label>
                Concern *
            </label>

            <textarea
                name="concern"
                placeholder="Describe your concern..."
                required
            ></textarea>


            <label>
                Additional Information
            </label>

            <textarea
                name="additional_information"
                placeholder="Add any additional information..."
            ></textarea>


            <div class="buttons">

                <button type="submit">
                    Submit Consultation
                </button>

                <a
                    class="back"
                    href="{{ url_for('student.dashboard') }}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
